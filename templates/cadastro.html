<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Planner de Casamento</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-rose-50 via-pink-50 to-purple-50 flex items-center justify-center px-4">

  <div class="w-full max-w-md">
    <div class="bg-white/90 backdrop-blur-sm shadow-2xl rounded-3xl border border-rose-100 p-8">

      <div class="text-center mb-8">
        <div class="text-5xl mb-3">💕</div>
        <h1 class="text-3xl font-bold text-gray-800">Criar conta</h1>
        <p class="text-gray-500 mt-2">Comece a organizar seu casamento agora</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for categoria, mensagem in messages %}
            <div class="mb-4 rounded-2xl px-4 py-3 text-sm bg-red-100 text-red-700 border border-red-200">
              {{ mensagem }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="/cadastro" class="space-y-5">
        <input
    type="hidden"
    name="csrf_token"
    value="{{ csrf_token() }}"
>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Nome</label>
          <input
            type="text"
            name="nome"
            placeholder="Digite seu nome"
            required
            class="w-full px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-rose-300"
          >
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">E-mail</label>
          <input
            type="email"
            name="email"
            placeholder="Digite seu e-mail"
            required
            class="w-full px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-rose-300"
          >
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
          <input
            type="password"
            name="senha"
            placeholder="Crie uma senha"
            required
            class="w-full px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-rose-300"
          >
        </div>

        <button
          type="submit"
          class="w-full bg-rose-500 hover:bg-rose-600 text-white font-semibold py-3 rounded-2xl shadow-lg shadow-rose-200 transition"
        >
          Cadastrar
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-6">
        Já possui conta?
        <a href="/login" class="text-rose-500 font-semibold hover:text-rose-600">Entrar</a>
      </p>
    </div>
  </div>

</body>
</html>
